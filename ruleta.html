<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ruleta diaria Proyecto Anti Parálisis</title>
</head>
<body>

<h2>Ruleta diaria Proyecto Anti Parálisis</h2>

<button id="spinBtn" onclick="spin()">Girar ruleta</button>

<p id="result"></p>

<script>
const options = [
  "Continuar proyecto actual",
  "Empezar nuevo proyecto",
  "Descansar / no decidir"
];

// Fecha de hoy
function today() {
  return new Date().toISOString().split("T")[0];
}

// Puede girar?
function canSpin() {
  const last = localStorage.getItem("lastSpinDate");
  return last !== today();
}

// Guardar fecha
function markUsed() {
  localStorage.setItem("lastSpinDate", today());
}

// Guardar resultado
function saveResult(result) {
  localStorage.setItem("lastResult", result);
}

// Obtener resultado guardado
function getSavedResult() {
  return localStorage.getItem("lastResult");
}

// Mostrar estado guardado
function showSavedState() {
  const saved = getSavedResult();

  if (saved) {
    document.getElementById("result").innerText =
      "Resultado: " + saved + "\nYa has girado hoy. Vuelve mañana.";
  } else {
    document.getElementById("result").innerText =
      "Ya has girado hoy. Vuelve mañana.";
  }

  document.getElementById("spinBtn").disabled = true;
}

// Girar ruleta
function spin() {
  if (!canSpin()) {
    showSavedState();
    return;
  }

  const choice = options[Math.floor(Math.random() * options.length)];

  document.getElementById("result").innerText =
    "Resultado: " + choice;

  saveResult(choice);
  markUsed();

  document.getElementById("spinBtn").disabled = true;
}

// Al cargar la página
function renderOnLoad() {
  const saved = getSavedResult();

  if (saved) {
    document.getElementById("result").innerText =
      "Resultado: " + saved;
  }

  if (!canSpin()) {
    document.getElementById("result").innerText =
      "Resultado: " + saved + "\nYa has girado hoy. Vuelve mañana.";

    document.getElementById("spinBtn").disabled = true;
  }
}

renderOnLoad();
</script>

</body>
</html>
